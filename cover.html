<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0f1115;color:#e8e6e3;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px;position:relative;overflow:hidden}
.glow{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(120,180,255,.18),transparent 62%);top:-280px;right:-180px}
.glow2{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(160,255,190,.10),transparent 65%);bottom:-260px;left:-140px}
.k{font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:#7f8a99}
h1{font-size:104px;line-height:.95;letter-spacing:-.03em;font-weight:800;margin-top:14px}
h1 span{color:#9ecbff}
p{font-size:30px;color:#b9c2cf;margin-top:26px;max-width:900px;line-height:1.35}
.row{display:flex;gap:14px;font-size:20px;color:#cfd6e0}
.pill{border:1px solid #2a3140;background:#161a21;border-radius:999px;padding:12px 22px}
.sloth{position:absolute;right:78px;bottom:64px;font-size:120px;opacity:.92}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div>
  <div class="k">local-first · open weights</div>
  <h1>sloth<span>box</span></h1>
  <p>Semantic search over your notes that never phones home.</p>
</div>
<div class="row">
  <div class="pill">23 MB model on CPU</div>
  <div class="pill">0 network calls</div>
  <div class="pill">1 JSON file you own</div>
  <div class="pill">MIT</div>
</div>
<div class="sloth">🦥</div>
</body></html>
